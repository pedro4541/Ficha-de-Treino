<title>Treino Natalie &amp; Vlad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#000;--c1:#1A1A1A;--c2:#2B2B2B;--bd:#333;--txt:#fff;--dim:#9a9a9a;--dim2:#c8c8c8;
  --red:#E30613;--ok:#fff;
  --n:#F7A8C9;--v:#8EC9FF;--p:var(--n);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
body.pv{--p:var(--v);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4;min-height:100vh;padding-bottom:calc(110px + var(--safe-b));-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input,textarea{font:inherit;color:var(--txt);}
.wrap{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));}

/* HEADER fixo (respeita a Dynamic Island) */
.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:var(--safe-t);border-bottom:1px solid var(--c2);}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px;}
.logo{font-weight:900;letter-spacing:.5px;font-size:18px;display:flex;align-items:center;gap:8px;}
.logo .stripe{width:18px;height:18px;background:repeating-linear-gradient(90deg,#fff 0 3px,#000 3px 6px);border:1px solid #fff;border-radius:3px;}
.ver{font-size:11px;font-weight:700;border:1px solid #fff;border-radius:999px;padding:1px 7px;}
.sync{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;}
.sync.ok i{background:#fff;} .sync.err i{background:var(--red);} .sync.busy i{background:var(--dim2);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25}}
.people{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--c1);border-radius:12px;padding:4px;}
.people button{padding:9px;border-radius:9px;font-weight:700;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:7px;}
.people button i{width:9px;height:9px;border-radius:50%;}
.people button[data-p=n] i{background:var(--n);} .people button[data-p=v] i{background:var(--v);}
.people button.on{background:#fff;color:#000;}
.tabs{display:flex;gap:2px;margin-top:8px;}
.tabs button{flex:1;padding:9px 2px 10px;font-size:13px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;}
.tabs button.on{color:#fff;border-color:var(--p);}

/* GERAL */
h2{font-size:22px;font-weight:800;margin:18px 0 4px;}
.sub{color:var(--dim);font-size:13px;}
.card{background:var(--c1);border:1px solid var(--c2);border-radius:14px;padding:14px;margin-top:12px;}
.row{display:flex;align-items:center;gap:10px;}
.sp{flex:1;}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--c2);color:var(--dim2);}
.pill.p{background:var(--p);color:#000;}
.pill.w{background:#fff;color:#000;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--c2);}
.btn.w{background:#fff;color:#000;}
.btn.red{background:var(--red);color:#fff;}
.btn.full{width:100%;}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px;}
.muted{color:var(--dim);}
.phase{display:flex;align-items:center;gap:8px;margin-top:12px;}
.seg{display:inline-flex;background:var(--c1);border:1px solid var(--c2);border-radius:10px;padding:3px;}
.seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:700;color:var(--dim);}
.seg button.on{background:var(--p);color:#000;}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);font-weight:700;margin-bottom:4px;}
.note{font-size:13px;color:var(--dim2);}
ul.clean{list-style:none;}
ul.clean li{padding:6px 0;border-top:1px solid var(--c2);font-size:13px;color:var(--dim2);}
ul.clean li:first-child{border-top:none;}
details.rules summary{list-style:none;font-size:13px;color:var(--dim);cursor:pointer;}
details.rules summary::-webkit-details-marker{display:none;}
.empty{text-align:center;color:var(--dim);padding:30px 10px;}

/* EXERCÍCIO */
.ex{background:var(--c1);border:1px solid var(--c2);border-radius:14px;margin-top:10px;overflow:hidden;}
.ex.done{border-color:#fff;}
.exh{display:flex;gap:12px;padding:14px;align-items:flex-start;}
.exn{width:30px;height:30px;border-radius:8px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
.ex.done .exn{background:#fff;color:#000;}
.exname{font-weight:700;font-size:16px;}
.exmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.cnt{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--c2);white-space:nowrap;}
.ex.done .cnt{background:#fff;color:#000;}
.alt-on{font-size:12px;color:var(--p);margin-top:4px;}
.last{font-size:12px;color:var(--dim);padding:0 14px 6px;}
.sets{padding:0 14px 10px;}
.set{display:grid;grid-template-columns:54px 1fr 1fr 50px;gap:6px;align-items:center;margin-bottom:6px;}
.set.nl{grid-template-columns:54px 1fr 50px;}
.set .sn{font-size:12px;color:var(--dim);font-weight:700;}
.set input{width:100%;background:#000;border:1px solid var(--c2);border-radius:9px;padding:9px 8px;font-size:16px;text-align:center;}
.set input:focus{outline:none;border-color:var(--p);}
.chk{height:40px;border-radius:10px;border:2px solid var(--c2);font-size:18px;font-weight:900;color:var(--dim);}
.set.ok .chk{background:#fff;border-color:#fff;color:#000;}
.set.ok input{border-color:#555;color:var(--dim2);}
.hdr{display:grid;grid-template-columns:54px 1fr 1fr 50px;gap:6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-bottom:4px;}
.hdr.nl{grid-template-columns:54px 1fr 50px;}
.more{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--c2);font-size:13px;font-weight:700;color:var(--dim2);}
.info{padding:0 14px 14px;}
.info .blk{background:#000;border:1px solid var(--c2);border-radius:10px;padding:11px 12px;margin-top:8px;font-size:14px;}
.alt{border-top:1px solid var(--c2);padding:9px 0;}
.alt:first-of-type{border-top:none;}
.alt b{display:block;font-size:14px;}
.alt p{font-size:13px;color:var(--dim2);margin:2px 0 7px;}

/* CARDIO */
.blocks{margin-top:8px;}
.bk{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--c2);font-size:14px;}
.bk:first-child{border-top:none;}
.bk .t{font-weight:700;}
.bk .d{font-size:12px;color:var(--dim);}
.bk .num{font-weight:800;text-align:right;white-space:nowrap;}

/* SEMANA */
.day{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--c1);border:1px solid var(--c2);border-radius:12px;margin-top:8px;width:100%;text-align:left;}
.day.today{border-color:var(--p);}
.day .dn{width:40px;font-weight:800;color:var(--dim2);}
.day .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--c2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;}
.day .tick.ok{background:#fff;border-color:#fff;color:#000;}
.day.rest{opacity:.55;}

/* HISTÓRICO */
.wk{margin-top:18px;}
.wkh{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);font-weight:700;margin-bottom:2px;}
.log{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--c1);border:1px solid var(--c2);border-radius:12px;margin-top:7px;}
.log .lt{font-weight:700;font-size:14px;}
.log .ld{font-size:12px;color:var(--dim);margin-top:2px;}
.log .act{display:flex;gap:4px;}
.log .act button{width:34px;height:34px;border-radius:9px;background:var(--c2);font-size:14px;}
.pend{font-size:10px;color:var(--dim);border:1px dashed var(--dim);border-radius:6px;padding:0 4px;margin-left:4px;}
.chartbox{position:relative;height:220px;}

/* TIMER DE DESCANSO */
.rest{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(14px + var(--safe-b));width:min(600px,calc(100% - 24px));background:#fff;color:#000;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:30;transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.6);}
.rest.on{transform:translateX(-50%) translateY(0);}
.rest .rt{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;min-width:86px;}
.rest .rl{font-size:12px;font-weight:700;color:#555;}
.rest .bar2{height:5px;background:#ddd;border-radius:3px;margin-top:5px;overflow:hidden;}
.rest .bar2 div{height:100%;background:#000;}
.rest button{background:#000;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800;font-size:13px;}
.rest.end{background:var(--red);color:#fff;} .rest.end .rl{color:#fff;} .rest.end button{background:#fff;color:#000;}

/* TIMER GUIADO (tela cheia) */
.gt{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;padding:calc(var(--safe-t) + 10px) 18px calc(var(--safe-b) + 16px);}
.gt.on{display:flex;}
.gt .gtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);}
.gt .gname{font-size:15px;font-weight:700;color:#fff;}
.gt .phase-n{text-align:center;margin-top:18px;font-size:15px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--p);}
.gt .big{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;text-align:center;}
.gt .vel{font-size:clamp(64px,22vw,120px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;}
.gt .vel small{font-size:.32em;font-weight:700;color:var(--dim2);margin-left:4px;}
.gt .inc{font-size:clamp(34px,11vw,60px);font-weight:900;}
.gt .inc small{font-size:.45em;font-weight:700;color:var(--dim2);}
.gt .lbl{font-size:clamp(56px,18vw,110px);font-weight:900;line-height:1;}
.gt .cd{font-size:clamp(46px,15vw,84px);font-weight:900;font-variant-numeric:tabular-nums;margin-top:12px;}
.gt .rpe{font-size:14px;color:var(--dim2);}
.gt .obs{font-size:13px;color:var(--dim);max-width:420px;}
.gt .hr{font-size:13px;font-weight:700;border:1px solid var(--dim);border-radius:999px;padding:3px 10px;color:var(--dim2);}
.gt .next{background:var(--c1);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--dim2);display:flex;justify-content:space-between;gap:8px;}
.gt .prog{height:8px;background:var(--c2);border-radius:4px;margin:12px 0 4px;overflow:hidden;}
.gt .prog div{height:100%;background:#fff;}
.gt .ptx{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;}
.gt .ctl{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin-top:12px;}
.gt .ctl button{padding:15px 6px;border-radius:14px;background:var(--c2);font-weight:800;font-size:15px;}
.gt .ctl button.main{background:#fff;color:#000;}
.gt.flash{animation:fl .6s;}
@keyframes fl{0%{background:#fff}100%{background:#000}}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.modal.on{display:flex;}
.sheet{background:var(--c1);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b));max-height:92vh;overflow:auto;border-top:1px solid var(--c2);}
.sheet h3{font-size:19px;margin-bottom:4px;}
.rpes{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px;}
.rpes button{padding:10px 0;border-radius:8px;background:#000;border:1px solid var(--c2);font-weight:800;font-size:14px;}
.rpes button.on{background:#fff;color:#000;}
.fld{margin-top:14px;}
.fld input,.fld textarea{width:100%;background:#000;border:1px solid var(--c2);border-radius:10px;padding:11px;font-size:16px;}
.fld textarea{min-height:70px;resize:vertical;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;z-index:80;display:none;max-width:90%;text-align:center;}
.toast.on{display:block;}
footer{text-align:center;color:#555;font-size:11px;margin:30px 0 10px;}
</style>
</head>

<script>
/* ════════════════════ CONFIG ════════════════════ */
const GS_URL = 'https://script.google.com/macros/s/AKfycbwMFCaF-uDlZWL_9SQJwZRZv6roBpipTL1yZ0Eh82OBxAyzhGjeshO-W4WPmYaH4q-fAg/exec'; // URL /exec do Apps Script (vazio = só salva neste celular)
const VERSION = 'v1.1';

/* ════════════════════ DADOS DOS TREINOS ════════════════════ */
const PESSOAS = [{"id":"n","nome":"Natalie","frequencia":"4x fixos + 1 opcional","duracao_min":"30-40","semana":[{"dia":"Seg","treino":"n_A"},{"dia":"Ter","treino":"n_B"},{"dia":"Qua","treino":"descanso","obs":"Caminhada leve livre (opcional)"},{"dia":"Qui","treino":"n_C"},{"dia":"Sex","treino":"n_D"},{"dia":"Sáb","treino":"n_E","opcional":true},{"dia":"Dom","treino":"descanso"}],"regras":["Peso certo: as 2 últimas repetições de cada série devem ser difíceis (esforço 8 de 10). Se sobrar fôlego para 3 ou mais, aumente o peso.","Descanso marcado no cronômetro do app — é o que mantém o treino em 30–40 min e o gasto calórico alto.","Antes de cada treino: 4 min de bike ou elíptico + 1 série leve do 1º exercício.","Fase 2: +1 série no 1º exercício de cada treino de perna e 15s a menos de descanso nos exercícios menores (o app já ajusta sozinho).","Incômodo leve (até 3 de 10) que passa em 24h é aceitável. Mais que isso: troque pela alternativa e diminua o movimento."],"treinos":[{"id":"n_A","nome":"Treino A · Glúteo","foco":"Glúteo máximo e médio","duracao_est_min":37,"aquecimento":"4 min bike/elíptico leve","exercicios":[{"id":"n_hipthrust","name":"Elevação Pélvica","muscle":"Glúteo Máximo","sets":4,"reps":"10–12","rest":75,"exec":"Escápulas apoiadas no banco, pés na largura do quadril, canelas verticais no topo. Suba contraindo o glúteo e segure 1s em cima. Queixo levemente para baixo, sem arquear a lombar.","progress":"Suba 5kg quando fizer 4x12 com pausa de 1s no topo.","alt":[{"name":"Elevação pélvica na máquina","exec":"Sente na máquina, costas no encosto, cinto no quadril. Suba o quadril apertando o glúteo e segure 1s em cima."},{"name":"Ponte de glúteo no chão","exec":"Deitada de barriga para cima, joelhos dobrados, peso sobre o quadril. Suba o quadril apertando o glúteo, segure 1s e desça devagar."}]},{"id":"n_pullthrough","name":"Puxada de Glúteo na Polia","muscle":"Glúteo · Posterior","sets":3,"reps":"12–15","rest":60,"exec":"Fique de costas para a polia baixa, segurando a corda entre as pernas. Joelhos levemente dobrados e parados. Leve o bumbum para trás (como se fosse fechar uma porta com ele) e depois empurre o quadril para frente apertando forte o glúteo. Quem trabalha é o quadril, não o joelho.","progress":"Suba 1 placa quando fizer 3x15 com contração forte no final.","alt":[{"name":"Glúteo na máquina (coice)","exec":"Apoie o peito e os braços na máquina, um pé na plataforma. Empurre a perna para trás e para cima apertando o glúteo, volte devagar."},{"name":"Extensão de quadril no banco inclinado","exec":"Quadril apoiado na borda do banco inclinado, calcanhares presos. Desça com as costas retas e suba apertando o glúteo até o corpo ficar reto."}]},{"id":"n_stiff","name":"Inclinação com Halteres (Stiff)","muscle":"Posterior de Coxa · Glúteo","sets":3,"reps":"10–12","rest":60,"exec":"Joelhos levemente flexionados e fixos. Empurre o quadril para trás deslizando os halteres rente às coxas até sentir alongar o posterior. Coluna neutra o tempo todo. Suba contraindo o glúteo.","progress":"Suba 2kg por halter quando completar 3x12 sem arredondar as costas.","alt":[{"name":"Stiff com barra","exec":"Mesmo movimento, segurando uma barra: joelhos levemente dobrados, leve o quadril para trás com a barra rente às pernas e suba apertando o glúteo."},{"name":"Mesa flexora","exec":"Deitada de bruços na máquina, dobre os joelhos trazendo o rolo perto do bumbum. Desça em 3s."}]},{"id":"n_abducao","name":"Cadeira Abdutora","muscle":"Glúteo Médio","sets":3,"reps":"15–20","rest":45,"exec":"Tronco levemente inclinado à frente (ativa mais o glúteo). Abra controlando, segure 1s aberto, volte em 2s sem bater o peso.","progress":"Suba a carga quando fizer 20 reps limpas. Fase 2: na última série, ao terminar, tire 30% do peso e continue até não conseguir mais.","alt":[{"name":"Abrir a perna na polia","exec":"Em pé, de lado para a polia, tornozeleira na perna de fora. Leve a perna para o lado sem inclinar o corpo. Volte devagar."},{"name":"Abrir as pernas com elástico","exec":"Sentada, elástico acima dos joelhos. Abra os joelhos contra o elástico, segure 1s e volte devagar."}]},{"id":"n_coice","name":"Coice na Polia","muscle":"Glúteo Máximo","sets":2,"reps":"12–15/perna","rest":30,"exec":"Tornozeleira no cabo baixo, mãos apoiadas. Leve a perna para trás e levemente para cima sem arquear a lombar. Aperte o glúteo no final.","progress":"Suba 1 placa quando fizer 15 reps controladas.","alt":[{"name":"Coice na máquina","exec":"Peito apoiado, pé na plataforma. Empurre a perna para trás apertando o glúteo e volte devagar."},{"name":"Coice de 4 apoios","exec":"No chão com mãos e joelhos apoiados, caneleira no tornozelo. Leve uma perna para trás e para cima, joelho dobrado, sem arquear as costas."}]}]},{"id":"n_B","nome":"Treino B · Parte de Cima e Barriga","foco":"Costas, peito, ombros e barriga","duracao_est_min":34,"aquecimento":"4 min elíptico/remo ergômetro leve","exercicios":[{"id":"n_puxada","name":"Puxada para Baixo (Costas)","muscle":"Costas","sets":3,"reps":"10–12","rest":60,"exec":"Pegada um pouco mais aberta que os ombros. Peito para cima, puxe a barra até o alto do peito levando os cotovelos para baixo. Suba controlando.","progress":"Suba 1 placa quando fizer 3x12.","alt":[{"name":"Puxada com pegador em V","exec":"Mesmo aparelho com o pegador em V. Puxe até o peito levando os cotovelos para baixo."},{"name":"Puxada na máquina","exec":"Sente, segure as alças e puxe para baixo levando os cotovelos ao lado do corpo. Suba devagar."}]},{"id":"n_supino","name":"Empurrar na Máquina (Peito)","muscle":"Peito · Tríceps","sets":3,"reps":"10–12","rest":60,"exec":"Pegada na linha do meio do peito, escápulas encaixadas no banco. Empurre sem travar os cotovelos e volte em 2s.","progress":"Suba 1 placa quando fizer 3x12.","alt":[{"name":"Supino com halteres","exec":"Deitada no banco, halteres na altura do peito. Empurre para cima e desça devagar em 2s."},{"name":"Flexão com joelho no chão","exec":"Mãos um pouco mais const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const dm = s => { const d = parseYmd(s); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const dayIdx = d => (d.getDay() + 6) % 7; // 0 = segunda
const mondayOf = s => { const d = parseYmd(s); d.setDate(d.getDate() - dayIdx(d)); return ymd(d); };
const fmtNum = (n, dec = 1) => Number(n).toFixed(dec).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '').replace('.', ',');
const vel = v => Number(v).toFixed(1).replace('.', ',');
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const uid = () => 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const treinoById = id => { for (const p of PESSOAS) { const t = p.treinos.find(t => t.id === id); if (t) return t; } return null; };

const LS = { logs: 'nv_logs', pend: 'nv_pending', del: 'nv_deleted', who: 'nv_who', fase: 'nv_fase', fc: 'nv_fc', sess: 'nv_sess', gt: 'nv_gt' };
let logs = lsGet(LS.logs, []);
let pending = lsGet(LS.pend, []);      // logs a enviar (grava/edita)
let pendingDel = lsGet(LS.del, []);    // ids a apagar
let sess = lsGet(LS.sess, {});         // treinos em andamento (séries marcadas)
const ui = { who: lsGet(LS.who, 'n'), view: 'hoje', open: null, info: {} };
function fase(p) { return (lsGet(LS.fase, {})[p || ui.who]) || 1; }
function setFase(p, f) { const o = lsGet(LS.fase, {}); o[p] = f; lsSet(LS.fase, o); }
function persist() { lsSet(LS.logs, logs); lsSet(LS.pend, pending); lsSet(LS.del, pendingDel); }

/* chave de deduplicação: mesma pessoa + treino + data */
const keyOf = l => l.pessoa + '|' + l.treinoId + '|' + l.data;
function norm(l) {
  let det = l.detalhes;
  if (typeof det === 'string') { try { det = JSON.parse(det); } catch (e) { det = {}; } }
  return {
    id: String(l.id), data: String(l.data).slice(0, 10), pessoa: String(l.pessoa), treinoId: String(l.treinoId),
    treinoNome: String(l.treinoNome || ''), fase: Number(l.fase) || 1, detalhes: det || {},
    rpe: l.rpe === '' || l.rpe == null ? null : Number(l.rpe), obs: String(l.obs || ''), criadoEm: String(l.criadoEm || '')
  };
}
function dedupe(list) {
  const m = new Map();
  for (const l of list) { const k = keyOf(l), o = m.get(k); if (!o || String(l.criadoEm) >= String(o.criadoEm)) m.set(k, l); }
  return [...m.values()];
}
/* ÚNICA função de leitura dos registros */
function getLogs(p) {
  return dedupe(logs).filter(l => !p || l.pessoa === p)
    .sort((a, b) => (b.data + b.criadoEm).localeCompare(a.data + a.criadoEm));
}

/* ════════════════════ SINCRONIZAÇÃO (Apps Script) ════════════════════
   Tudo é salvo primeiro no localStorage; o envio para a planilha roda em
   segundo plano e é refeito quando a internet voltar. Isolado aqui para
   facilitar trocar o backend no futuro. */
let syncing = false;
function setSync(state, txt) { const s = $('#sync'); s.className = 'sync ' + state; s.querySelector('span').textContent = txt; }
async function api(body) {
  const r = await fetch(GS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'erro'); return j;
}
async function sync() {
  if (!GS_URL) { setSync('', 'salvo no celular'); return; }
  if (syncing) return; syncing = true;
  setSync('busy', 'sincronizando…');
  try {
    for (const l of [...pending]) { await api({ action: 'save', log: l }); pending = pending.filter(x => x.id !== l.id); persist(); }
    for (const id of [...pendingDel]) { await api({ action: 'delete', id }); pendingDel = pendingDel.filter(x => x !== id); persist(); }
    const r = await fetch(GS_URL + '?action=list&t=' + Date.now());
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'erro');
    const server = j.logs.map(norm);
    const ids = new Set(server.map(l => l.id));
    logs = dedupe(server.concat(pending.filter(l => !ids.has(l.id)).map(norm)).filter(l => !pendingDel.includes(l.id)));
    persist(); setSync('ok', 'sincronizado');
    const ae = document.activeElement;
    if (!$('#modal').classList.contains('on') && !(ae && /INPUT|TEXTAREA/.test(ae.tagName))) render();
  } catch (e) {
    persist(); setSync('err', 'offline · salvo aqui');
  } finally { syncing = false; }
}
function saveLog(l) {
  l = norm(l);
  const same = logs.find(x => keyOf(x) === keyOf(l) && x.id !== l.id);
  if (same) { l.id = same.id; } // dedup: substitui o registro do mesmo dia
  logs = logs.filter(x => x.id !== l.id && keyOf(x) !== keyOf(l));
  logs.push(l);
  pending = pending.filter(x => x.id !== l.id); pending.push(l);
  persist(); sync();
}
function deleteLog(id) {
  logs = logs.filter(l => l.id !== id); pending = pending.filter(l => l.id !== id);
  if (GS_URL && !pendingDel.includes(id)) pendingDel.push(id); // apagar de um id que não existe no servidor é inofensivo
  persist(); sync();
}

/* ════════════════════ PLANO (com ajustes da fase) ════════════════════ */
function exercisesOf(t, f) {
  return t.exercicios.map((e, i) => {
    const x = { ...e };
    if (f === 2) {
      if (i === 0 && LEG_DAYS.includes(t.id)) x.sets = e.sets + 1;
      if (ISOLADORES.includes(e.id)) x.rest = Math.max(15, e.rest - 15);
      if (e.id === 'n_hiit_bike') { x.sets = 8; x.exec = e.exec.replace('6 minutos totais', '8 minutos totais').replace('Repita 6x', 'Repita 8x'); }
    }
    return x;
  });
}
function cardioBlocks(t, f) {
  let b = JSON.parse(JSON.stringify(t.blocos));
  if (f === 2) {
    if (t.id === 'n_E') b.forEach(x => { if (x.incl_pct === 10) x.incl_pct = 12; });
    if (t.id === 'v_2') b.forEach(x => { if (x.repeticoes) { x.repeticoes = 5; x.trabalho.seg = 180; x.min = 25; x.obs = '5x (3 min trote leve + 2 min caminhada). Trote em ritmo de frases curtas, nunca no máximo.'; } });
    if (t.id === 'v_3') b.forEach(x => { if (!/aquecimento/i.test(x.fase)) x.vel_kmh = 5.8; if (x.fase === 'Topo') x.incl_pct = 12; });
  }
  return b;
}
function blockText(b) {
  if (b.repeticoes) return `${b.fase}: ${b.min} min — ${b.obs || ''}`;
  return `${b.fase}: ${b.min} min a ${vel(b.vel_kmh)} km/h, inclinação ${b.incl_pct}%` + (b.obs ? ` — ${b.obs.replace(/\.+$/, '')}` : '') + '.';
}
const rpeTxt = r => r ? `esforço ${r} de 10` : '';
function cardioSteps(t, f) {
  const steps = [];
  for (const b of cardioBlocks(t, f)) {
    if (b.repeticoes) {
      for (let i = 1; i <= b.repeticoes; i++) {
        steps.push({ fase: `Trote ${i}/${b.repeticoes}`, sec: b.trabalho.seg, vel: b.trabalho.vel_kmh, incl: b.trabalho.incl_pct, rpe: b.trabalho.rpe, obs: b.obs });
        steps.push({ fase: `Caminhada ${i}/${b.repeticoes}`, sec: b.recuperacao.seg, vel: b.recuperacao.vel_kmh, incl: b.recuperacao.incl_pct, rpe: b.recuperacao.rpe });
      }
    } else steps.push({ fase: b.fase, sec: b.min * 60, vel: b.vel_kmh, incl: b.incl_pct, rpe: b.rpe, obs: b.obs });
  }
  return steps;
}
function bikeSteps(n) {
  const s = [];
  for (let i = 1; i <= n; i++) {
    s.push({ fase: `Tiro ${i}/${n}`, sec: 20, label: 'FORTE', rpe: '8–9', obs: 'Pedale forte, quase sem conseguir falar.' });
    s.push({ fase: `Leve ${i}/${n}`, sec: 40, label: 'Leve', rpe: '2–3', obs: 'Pedale bem leve e recupere o fôlego.' });
  }
  return s;
}
const kmOf = steps => steps.reduce((a, s) => a + (s.vel ? s.vel * (s.done != null ? s.done : s.sec) / 3600 : 0), 0);

/* ════════════════════ SESSÃO (séries marcadas) ════════════════════ */
const sessKey = tid => ui.who + '|' + tid + '|' + today();
function getSess(tid) { const k = sessKey(tid); if (!sess[k]) sess[k] = { ex: {} }; return sess[k]; }
function saveSess() {
  const t = today(); for (const k of Object.keys(sess)) if (!k.endsWith(t)) delete sess[k];
  lsSet(LS.sess, sess);
}
function exState(tid, ex) {
  const s = getSess(tid);
  if (!s.ex[ex.id]) s.ex[ex.id] = { sets: [], como: '' };
  const st = s.ex[ex.id];
  while (st.sets.length < ex.sets) st.sets.push({ c: '', r: '', d: false });
  return st;
}
function lastFor(exId) {
  for (const l of getLogs(ui.who)) {
    const e = (l.detalhes.exercicios || []).find(x => x.id === exId);
    if (e && e.series && e.series.some(s => s.feito)) return { data: l.data, series: e.series.filter(s => s.feito) };
  }
  return null;
}
function doneThisWeek(p) {
  const mon = mondayOf(today()), set = new Set();
  getLogs(p).forEach(l => { if (mondayOf(l.data) === mon) set.add(l.treinoId); });
  return set;
}

}

function phaseBar() {

}

function viewHoje() {

function strengthView(t, f) {
  const exs = exercisesOf(t, f);

    }

    for (let s = 0; s < e.sets; s++) {

      </div></div>`;
    h += `</div>`;

  h += `<button class="btn red full" style="margin-top:16px" data-finish="${t.id}">🏁 Finalizar treino</button>`;

function cardioView(t, f) {
  const bl = cardioBlocks(t, f), steps = cardioSteps(t, f);

  h += `<div class="card"><div class="label">Não quer ou não pode fazer esse hoje? Faça assim:</div>${t.alt.map(a => `<div class="alt"><b>${esc(a.name)}</b><p>${esc(a.exec)}</p><button class="btn sm" data-altdone="${t.id}|${esc(a.name)}">Fiz esta — registrar</button></div>`).join('')}</div>`;

let chart;

  else h += `<div class="card"><div class="label">Instalar como app</div>
    ${installEvt ? '<button class="btn w full" data-install>📲 Instalar app</button>' : ''}
    <div class="note" style="margin-top:${installEvt ? 10 : 0}px"><b>Android:</b> abra no Chrome → menu ⋮ → “Instalar app” (ou “Adicionar à tela inicial”).<br><b>iPhone:</b> abra no Safari → botão Compartilhar → “Adicionar à Tela de Início”.</div></div>`;
  return h;
}

/* ════════════════════ TIMER DE DESCANSO ════════════════════ */
const rest = { end: 0, total: 0, t: null, beeped: false };
function startRest(sec, label) {
  if (!sec) return;
  rest.end = Date.now() + sec * 1000; rest.total = sec; rest.beeped = false;
  $('#restL').textContent = label || 'Descanso';
  $('#rest').classList.add('on'); $('#rest').classList.remove('end');
  clearInterval(rest.t); rest.t = setInterval(tickRest, 250); tickRest();
}
function tickRest() {
  const left = (rest.end - Date.now()) / 1000;
  $('#restT').textContent = mmss(left);
  $('#restB').style.width = Math.max(0, Math.min(100, left / rest.total * 100)) + '%';
  if (left <= 0 && !rest.beeped) { rest.beeped = true; $('#rest').classList.add('end'); $('#restL').textContent = 'Bora, próxima série!'; alertEnd(); setTimeout(stopRest, 4000); }
}
function stopRest() { clearInterval(rest.t); $('#rest').classList.remove('on', 'end'); }

/* ════════════════════ SOM / VIBRAÇÃO / TELA LIGADA ════════════════════ */
let actx;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep(freq = 880, dur = .15, when = 0) {
  try { if (!actx) return; const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = freq; o.type = 'square';
    g.gain.setValueAtTime(.18, actx.currentTime + when); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + when + dur);
    o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + when); o.stop(actx.currentTime + when + dur + .02); } catch (e) {}
}
function alertEnd() { beep(880, .18, 0); beep(880, .18, .25); beep(1320, .35, .5); try { navigator.vibrate && navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {} }
let wake = null;
async function keepAwake(on) {
  try { if (on && 'wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); }
    if (!on && wake) { await wake.release(); wake = null; } } catch (e) {}
}

/* ════════════════════ TIMER GUIADO ════════════════════
   Baseado em horário (Date.now), então continua certo mesmo se a tela bloquear. */
let G = lsGet(LS.gt, null), gTick = null;
function gtSave() { lsSet(LS.gt, G); }
function gtStart(kind, tid, steps, title) {
  unlockAudio();
  G = { kind, tid, who: ui.who, title, steps, i: 0, end: Date.now() + steps[0].sec * 1000, paused: false, left: steps[0].sec, started: Date.now(), cd: -1 };
  steps.forEach(s => s.done = 0);
  gtSave(); gtOpen(); beep(660, .2);
}
function gtOpen() { $('#gt').classList.add('on'); keepAwake(true); clearInterval(gTick); gTick = setInterval(gtTick, 200); gtTick(); }
function gtLeft() { return G.paused ? G.left : (G.end - Date.now()) / 1000; }
function gtGo(i, fromTimer) {
  const cur = G.steps[G.i];
  cur.done = fromTimer ? cur.sec : Math.max(0, cur.sec - Math.max(0, gtLeft()));
  if (i >= G.steps.length) return gtFinish(true);
  if (i < 0) i = 0;
  G.i = i; G.left = G.steps[i].sec; G.end = Date.now() + G.left * 1000; G.cd = -1;
  $('#gt').classList.remove('flash'); void $('#gt').offsetWidth; $('#gt').classList.add('flash');
  alertEnd(); gtSave(); gtTick();
}
function gtTick() {
  if (!G) return;
  let left = gtLeft();
  // se a tela ficou bloqueada, avança os blocos que já passaram
  while (!G.paused && left <= 0 && G.i < G.steps.length) {
    const over = -left; G.steps[G.i].done = G.steps[G.i].sec;
    if (G.i + 1 >= G.steps.length) return gtFinish(true);
    G.i++; G.end = Date.now() - over * 1000 + G.steps[G.i].sec * 1000; left = gtLeft();
    G.cd = -1; alertEnd(); $('#gt').classList.remove('flash'); void $('#gt').offsetWidth; $('#gt').classList.add('flash'); gtSave();
  }
  const s = G.steps[G.i], nx = G.steps[G.i + 1];
  const sl = Math.ceil(left); if (sl <= 3 && sl >= 1 && G.cd !== sl && !G.paused) { G.cd = sl; beep(520, .1); }
  const tot = G.steps.reduce((a, x) => a + x.sec, 0), el = G.steps.slice(0, G.i).reduce((a, x) => a + x.sec, 0) + (s.sec - Math.max(0, left));
  const fc = G.who === 'v' ? lsGet(LS.fc, {}).v : '';
  $('#gtName').textContent = G.title; $('#gtStep').textContent = `Bloco ${G.i + 1} de ${G.steps.length}`;
  $('#gtPhase').textContent = s.fase;
  $('#gtBig').innerHTML = (s.vel != null
    ? `<div class="vel">${vel(s.vel)}<small>km/h</small></div><div class="inc">${s.incl}<small>% inclinação</small></div>`
    : `<div class="lbl">${esc(s.label)}</div>`) +
    `<div class="cd">${mmss(left)}</div><div class="rpe">${esc(rpeTxt(s.rpe))}</div>${s.obs ? `<div class="obs">${esc(s.obs)}</div>` : ''}${fc ? `<div class="hr">❤ limite ${esc(fc)} bpm</div>` : ''}`;
  $('#gtNext').innerHTML = nx ? `<span>Próximo: <b>${esc(nx.fase)}</b></span><span>${nx.vel != null ? vel(nx.vel) + ' km/h · ' + nx.incl + '%' : esc(nx.label)} · ${mmss(nx.sec)}</span>` : '<span>Último bloco 💪</span>';
  $('#gtProg').style.width = Math.min(100, el / tot * 100) + '%';
  $('#gtEl').textContent = mmss(el) + ' feitos'; $('#gtTot').textContent = 'faltam ' + mmss(tot - el);
  $('#gtPause').textContent = G.paused ? '▶ Continuar' : 'Pausar';
}
function gtFinish(complete) {
  clearInterval(gTick); keepAwake(false);
  const g = G; G = null; lsSet(LS.gt, null);
  $('#gt').classList.remove('on');
  if (!g) return;
  if (!complete) g.steps[g.i].done = Math.max(0, g.steps[g.i].sec - Math.max(0, g.paused ? g.left : (g.end - Date.now()) / 1000));
  if (complete) alertEnd();
  const secs = g.steps.reduce((a, s) => a + (s.done || 0), 0);
  ui.who = g.who; lsSet(LS.who, ui.who);
  if (g.kind === 'bike') {
    const t = treinoById(g.tid), f = fase(), e = exercisesOf(t, f).find(x => x.id === 'n_hiit_bike'), st = exState(t.id, e);
    const n = Math.round(g.steps.filter(s => s.label === 'FORTE' && s.done >= s.sec - 1).length);
    st.sets.forEach((s, i) => { if (i < n) s.d = true; }); saveSess(); render();
    toast(complete ? 'Tiros concluídos! 🔥' : `${n} tiro(s) marcados.`);
  } else {
    openFinish(g.tid, { minutos: Math.round(secs / 60), km: +kmOf(g.steps).toFixed(2), concluido: complete });
  }
}

/* ════════════════════ FINALIZAR / EDITAR ════════════════════ */
let F = null;
function openFinish(tid, cardio, editId) {
  const t = treinoById(tid), ed = editId ? logs.find(l => l.id === editId) : null;
  const isC = t.tipo === 'cardio';
  const base = ed ? ed.detalhes : {};
  F = { tid, editId, rpe: ed ? ed.rpe : null, cardio: isC };
  const min = ed ? base.minutos : cardio ? cardio.minutos : t.duracao_est_min;
  const km = ed ? base.km : cardio ? cardio.km : isC ? +kmOf(cardioSteps(t, fase())).toFixed(2) : 0;
  F.extra = cardio || {};
  $('#sheet').innerHTML = `<h3>${ed ? 'Editar treino' : 'Finalizar treino'}</h3><div class="sub">${esc(t.nome)}${ed ? ' · ' + dm(ed.data) : ''}</div>
    ${!ed && !isC ? `<div class="note" style="margin-top:8px">${finishCount(t)}</div>` : ''}
    <div class="fld"><div class="label">Quão pesado foi o treino? (0 = nada, 10 = máximo)</div><div class="rpes">${[...Array(11)].map((_, i) => `<button data-rpe="${i}" class="${F.rpe === i ? 'on' : ''}">${i}</button>`).join('')}</div></div>
    ${isC ? `<div class="fld two"><div><div class="label">Minutos</div><input id="fMin" inputmode="numeric" value="${esc(min)}"></div><div><div class="label">km (aprox.)</div><input id="fKm" inputmode="decimal" value="${esc(fmtNum(km || 0, 2))}"></div></div>
      ${cardio && cardio.alternativa ? `<div class="note" style="margin-top:8px">Alternativa: <b>${esc(cardio.alternativa)}</b></div>` : ''}` : ''}
    <div class="fld"><div class="label">Observação (opcional)</div><textarea id="fObs" placeholder="Como se sentiu, o que mudou…">${esc(ed ? ed.obs : '')}</textarea></div>
    <div class="two" style="margin-top:16px"><button class="btn" data-cancel>Cancelar</button><button class="btn red" data-save>${ed ? 'Salvar' : '✓ Salvar treino'}</button></div>`;
  $('#modal').classList.add('on');
}
function finishCount(t) {
  const exs = exercisesOf(t, fase()); let d = 0, tot = 0;
  exs.forEach(e => { const st = exState(t.id, e); tot += e.sets; d += st.sets.slice(0, e.sets).filter(s => s.d).length; });
  return `${d} de ${tot} séries marcadas.` + (d < tot ? ' Tudo bem — salva o que foi feito.' : ' Treino completo! 💪');
}
function doSave() {
  const t = treinoById(F.tid), ed = F.editId ? logs.find(l => l.id === F.editId) : null;
  const num = v => parseFloat(String(v).replace(',', '.')) || 0;
  let det;
  if (ed) det = { ...ed.detalhes };
  else if (F.cardio) det = { tipo: 'cardio', blocos: cardioBlocks(t, fase()).map(b => ({ fase: b.fase, min: b.min, vel_kmh: b.vel_kmh, incl_pct: b.incl_pct, repeticoes: b.repeticoes })), concluido: !!F.extra.concluido, alternativa: F.extra.alternativa || '' };
  else {
    const exs = exercisesOf(t, fase());
    let vol = 0;
    det = { tipo: 'forca', exercicios: exs.map(e => {
      const st = exState(t.id, e);
      const series = st.sets.slice(0, e.sets).map(s => ({ carga: s.c, reps: s.r, feito: !!s.d }));
      series.forEach(s => { if (s.feito) vol += num(s.carga) * num(s.reps); });
      return { id: e.id, name: e.name, feito_como: st.como || '', series };
    }) };
    det.volume = Math.round(vol);
  }
  if (F.cardio) { det.minutos = num($('#fMin').value); det.km = num($('#fKm').value); }
  const l = {
    id: ed ? ed.id : uid(), data: ed ? ed.data : today(), pessoa: ed ? ed.pessoa : ui.who, treinoId: t.id, treinoNome: t.nome,
    fase: ed ? ed.fase : fase(), detalhes: det, rpe: F.rpe, obs: $('#fObs').value.trim(), criadoEm: new Date().toISOString()
  };
  saveLog(l);
  $('#modal').classList.remove('on'); F = null; stopRest();
  toast(ed ? 'Alterações salvas ✓' : 'Treino salvo! 💪');
  if (!ed) { ui.view = 'hist'; ui.open = null; ui.openFromHoje = false; window.scrollTo(0, 0); }
  render();
}

/* ════════════════════ EVENTOS ════════════════════ */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.p) { if (d.p !== ui.who) stopRest(); ui.who = d.p; lsSet(LS.who, d.p); ui.open = null; ui.openFromHoje = false; ui.info = {}; render(); window.scrollTo(0, 0); return; }
  if (d.v) { ui.view = d.v; ui.open = null; ui.openFromHoje = false; render(); window.scrollTo(0, 0); return; }
  if (d.f) { setFase(ui.who, +d.f); render(); return; }
  if (d.pick) { ui.open = d.pick; ui.openFromHoje = ui.view === 'hoje'; render(); window.scrollTo(0, 0); return; }
  if ('back' in d) { ui.open = null; ui.openFromHoje = false; render(); return; }
  if (d.info) { ui.info[d.info] = !ui.info[d.info]; render(); return; }
  if (d.set) {
    unlockAudio();
    const [tid, exId, s] = d.set.split('|'), t = treinoById(tid), ex = exercisesOf(t, fase()).find(x => x.id === exId);
    const st = exState(tid, ex), v = st.sets[+s];
    v.d = !v.d; saveSess(); render();
    if (v.d) {
      const nd = st.sets.slice(0, ex.sets).filter(x => x.d).length;
      if (ex.rest) startRest(ex.rest, nd >= ex.sets ? `${ex.name} ✓ — descanse e vá para o próximo` : `Descanso · ${ex.name}`);
    }
    return;
  }
  if (d.como !== undefined) { const [tid, exId, ...n] = d.como.split('|'); const t = treinoById(tid); exState(tid, exercisesOf(t, fase()).find(x => x.id === exId)).como = n.join('|'); saveSess(); render(); return; }
  if (d.bike) { const t = treinoById(d.bike), e2 = exercisesOf(t, fase()).find(x => x.id === 'n_hiit_bike'); gtStart('bike', t.id, bikeSteps(e2.sets), 'Tiros na Bike'); return; }
  if (d.go) { const t = treinoById(d.go); gtStart('cardio', t.id, cardioSteps(t, fase()), t.nome); return; }
  if (d.altdone) { const [tid, ...n] = d.altdone.split('|'); const t = treinoById(tid); openFinish(tid, { minutos: t.duracao_est_min, km: 0, alternativa: n.join('|') }); return; }
  if (d.finish) { openFinish(d.finish); return; }
  if (d.rpe !== undefined) { F.rpe = +d.rpe; document.querySelectorAll('.rpes button').forEach(x => x.classList.toggle('on', +x.dataset.rpe === F.rpe)); return; }
  if ('cancel' in d) { $('#modal').classList.remove('on'); F = null; return; }
  if ('save' in d) { doSave(); return; }
  if (d.edit) { const l = logs.find(x => x.id === d.edit); if (l) openFinish(l.treinoId, null, l.id); return; }
  if (d.del) { if (confirm('Apagar este treino do histórico?')) { deleteLog(d.del); render(); toast('Treino apagado'); } return; }
  if ('syncnow' in d) { sync(); return; }
  if ('install' in d) { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); } return; }
  if (d.rest) { if (d.rest === 'skip') stopRest(); else { rest.end += 15000; rest.total += 15; rest.beeped = false; $('#rest').classList.remove('end'); } return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.in) {
    const [tid, exId, s, k] = el.dataset.in.split('|'), t = treinoById(tid), ex = exercisesOf(t, fase()).find(x => x.id === exId);
    exState(tid, ex).sets[+s][k] = el.value; saveSess();
  }
  if (el.id === 'fcIn') { const o = lsGet(LS.fc, {}); o[ui.who] = el.value.replace(/\D/g, ''); lsSet(LS.fc, o); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') { $('#modal').classList.remove('on'); F = null; } });
$('#gtPause').onclick = () => { unlockAudio(); if (G.paused) { G.paused = false; G.end = Date.now() + G.left * 1000; } else { G.left = gtLeft(); G.paused = true; } gtSave(); gtTick(); };
$('#gtNextB').onclick = () => gtGo(G.i + 1, false);
$('#gtPrev').onclick = () => { const o = G.i; gtGo(Math.max(0, o - 1), false); G.steps[o].done = 0; G.steps[G.i].done = 0; gtSave(); };
$('#gtEnd').onclick = () => { if (confirm('Encerrar agora? O tempo feito até aqui será registrado.')) gtFinish(false); };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (G) keepAwake(true); sync(); } });
window.addEventListener('online', sync);
setInterval(() => { if (pending.length || pendingDel.length) sync(); }, 60000);

/* ════════════════════ PWA (Android + iPhone) ════════════════════ */
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (ui.view === 'cfg') render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('App instalado! 📲'); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw-natalie-vlad.js', { scope: './treino_natalie_vlad.html' }).catch(() => {});
}

/* ════════════════════ INÍCIO ════════════════════ */
$('#ver').textContent = VERSION;
$('#foot').textContent = `Treino Natalie & Vlad · ${VERSION}`;
logs = dedupe(logs.map(norm)); persist(); saveSess();
render();
if (G) { ui.who = G.who; render(); gtOpen(); }
sync();
</script>
